name: Collect deals and publish the site

# Runs every morning on GitHub's servers. No Claude involved.
on:
  schedule:
    - cron: "15 5 * * *"   # 05:15 UTC, before Belgian shops open
  push:
    branches: [main]
    paths: ["site/**", "seo/**"]
  workflow_dispatch: {}     # "Run workflow" button for a manual run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Keep yesterday's deals (to tell what's new for the daily email)
        if: github.event_name != 'push'
        run: cp data/deals.json "$RUNNER_TEMP/prev-deals.json" 2>/dev/null || true
      - name: Collect today's deals
        if: github.event_name != 'push'
        run: python -m collector.run
      - name: Refresh shop locations (Mondays, or when missing or without the Dutch shops)
        if: github.event_name != 'push'
        run: |
          if [ ! -f data/stores.json ] || [ "$(date -u +%u)" = "1" ] || ! grep -q '"cc":"NL"' data/stores.json; then
            python -m collector.locations || true
          fi
      - name: Dutch postal codes for Zeeuws-Vlaanderen (only when missing)
        if: github.event_name != 'push'
        run: |
          if [ ! -f data/postcodes-nl.json ]; then python -m collector.postcodes_nl || true; fi
      - name: Save the data
        if: github.event_name != 'push'
        run: |
          git config user.name "deal-collector"
          git config user.email "actions@users.noreply.github.com"
          for f in data/deals.json data/meta.json data/stores.json data/postcodes-nl.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Deals for $(date -u +%F)"
          # main may have moved while collecting (a merged PR): put the data commit on top, retry a few times
          ok=; for i in 1 2 3; do if git pull --rebase origin main && git push; then ok=1; break; fi; sleep 5; done; [ -n "$ok" ]
      - name: Daily notification and email (only the morning run; skipped until the secrets in docs/SETUP-ALERTS.md exist)
        if: github.event_name == 'schedule'
        continue-on-error: true   # a notification problem must never stop the site from updating
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ vars.ALERT_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m alerts.daily --prev "$RUNNER_TEMP/prev-deals.json"
      - name: Build the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp data/*.json _site/data/ 2>/dev/null || true
      - name: Add search-engine pages (landing pages, sitemap, robots.txt)
        # The site's public address. To move to your own domain, set a repository variable
        # SITE_URL (Settings > Secrets and variables > Actions > Variables), e.g. https://dealke.be
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m seo.build --site _site --deals data/deals.json --base-url "$SITE_URL"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
