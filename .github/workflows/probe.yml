name: Probe store pages (one-off)
on:
  push:
    branches: [claude/probe]
    paths: [tools/probe.py, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m tools.probe
      - run: |
          git config user.name "deal-collector"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -m "Probe results" || true; git push
