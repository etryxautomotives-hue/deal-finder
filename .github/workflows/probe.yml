name: Trial run of the collectors (probe branch only)
on:
  push:
    branches: [claude/probe]
    paths: [tools/**, collector/**, .github/workflows/probe.yml]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - run: python -m collector.run aldi lidl delhaize 2>&1 | tee probe-run.log
      - run: python -m collector.locations 2>&1 | tail -5 | tee -a probe-run.log || true
      - run: python tools/thumbs.py 2>&1 | tail -5 | tee -a probe-run.log || true
      - run: |
          mkdir -p probe; mv probe-run.log probe/; cp data/*.json probe/ 2>/dev/null || true
          git config user.name "deal-collector"; git config user.email "actions@users.noreply.github.com"
          git add probe; git commit -m "Trial run results" || true; git push
