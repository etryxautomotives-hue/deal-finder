    }

      subcart.products.forEach(function (cartLine) {

  const getPlaylistParamFromCart = (products, cartProducts, importantPages) => {

  /**

  /**
   * Filter cart items (exclude shopping list items) from a cart products array
   * @param {Array} cartProducts - Array of cart items

  var filterCartItems = function (cartProducts) {

    }

    return cartProducts.filter(function (cartLine) {

  /**
   * Sort cart items alphabetically by Rayon property
   * Items without Rayon are placed at the end
   * @param {Array} cartProducts - Array of cart items
   * @returns {Array} - Sorted array of cart items
   */
  var sortByRayon = function (cartProducts) {
    if (!cartProducts || !Array.isArray(cartProducts)) {
      return [];
    }

    // Create a copy to avoid mutating the original array
    var sortedProducts = cartProducts.slice();

    sortedProducts.sort(function (a, b) {
      var productA = window.wishlistV4.products[a.sku];
      var productB = window.wishlistV4.products[b.sku];

      var rayonA = productA ? (productA.Rayon || '') : '';
      var rayonB = productB ? (productB.Rayon || '') : '';

      // Items without Rayon go to the end
      if (!rayonA && !rayonB) {
        return 0; // Both have no Rayon, maintain order
      }
      if (!rayonA) {
        return 1; // A has no Rayon, put it after B
      }
      if (!rayonB) {
        return -1; // B has no Rayon, put it after A
      }

      // Alphabetical comparison (case-insensitive)
      return rayonA.localeCompare(rayonB, undefined, { sensitivity: 'base' });
    });

    return sortedProducts;
  };
  /**

  /**
   * Check if product has promo classique
   * @param {Object} product - Product object
   * @returns {boolean} - True if product has promo classique
   */
  const hasPromoClassique = (product) => {
    if (!product) return false;
    // Classic promo exists if we have a quantity threshold and either:
    // - a percentage discount (pourcent)  -> current behaviour
    // - or a fixed-price bundle (prix_fixe) for "X POUR Y€" type offers
    return !!(
      product.quantiter &&
      (product.pourcent || product.prix_fixe)
    );
  };

  /**
   * Check if product has promo carte
   * @param {Object} product - Product object
   * @returns {boolean} - True if product has promo carte
   */
  const hasPromoCarte = (product) => {
    if (!product) return false;
    // Card promo exists if we have a quantity threshold and either:
    // - a percentage discount (pourcent_carte)
    // - or a fixed-price bundle (prix_fixe_carte) for "X POUR Y€" card offers
    return !!(
      product.quantiter &&
      (product.pourcent_carte || product.prix_fixe_carte)
    );
  };

  /**
   * Get promo type for a product
   * @param {Object} product - Product object
   * @returns {string|null} - 'classique', 'carte', or null
   */
  const getPromoType = (product) => {
    if (!product) return null;

    // Check mutual exclusivity - classique takes precedence if both exist
    if (hasPromoClassique(product)) {
      return 'classique';
    }
    if (hasPromoCarte(product)) {

    }
    return null;
  };

  /**
   * Group cart products by groupe filtre (variantGroupReference).
   * Products with no variantGroupReference are treated as their own group using title (Nom produit), then sku as fallback.
   * @param {Array} cart - Cart array with {sku, attributes, quantity}
   * @param {Object} products - Products object (w4.products)
   * @returns {Object} - Grouped object { "GroupName": [...], "_ungrouped": [...] }
   */
  const groupCartProductsByFilter = (cart, products) => {
    const grouped = {};

    for (let i = 0; i < cart.length; i++) {
      const cartLine = cart[i];
      const product = products[cartLine.sku];

      if (!product) {
        // Product not found, skip
        continue;
      }

      // Use variant group if set; otherwise treat as own group by product name (title) or sku
      const groupName = product.variantGroupReference || product.title || product.sku || '_ungrouped';

      if (!grouped[groupName]) {
        grouped[groupName] = [];
      }

      // Add cart line with product reference
      grouped[groupName].push({
        ...cartLine,
        product: product
      });
    }

    return grouped;
  };

  /**
   * Calculate total quantity for a group
   * @param {Array} group - Array of cart lines in the group
   * @returns {number} - Total quantity
   */
  const getGroupTotalQuantity = (group) => {
    if (!group || group.length === 0) return 0;

    return group.reduce((total, cartLine) => {
      return total + (cartLine.quantity || 0);
    }, 0);
  };

  /**
   * Get promo threshold (quantiter) for a group
   * @param {Array} group - Array of cart lines in the group
   * @returns {number|null} - Threshold value or null if not available
   */
  const getGroupPromoThreshold = (group) => {
    if (!group || group.length === 0) return null;

    // Get threshold from first product in group (all products in group should have same threshold)
    const firstProduct = group[0].product;
    if (!firstProduct || !firstProduct.quantiter) {
      return null;
    }

    // quantiter is stored as string, convert to number
    const threshold = parseInt(firstProduct.quantiter, 10);
    return isNaN(threshold) ? null : threshold;
  };

  /**
   * Select products for discount using cheapest-first algorithm
   * When quantity exceeds threshold, creates multiple promo groups
   * @param {Array} group - Array of cart lines in the group
   * @param {number} threshold - Quantity threshold for promo
   * @returns {Array} - Array of promo groups, each containing selected products
   *   Format: [{ products: [{cartLine, quantity}], totalQuantity: number }, ...]
   */
  const selectProductsForDiscount = (group, threshold) => {
    if (!group || group.length === 0 || !threshold) {
      return [];
    }

    // Sort products by price (ascending) - cheapest first
    // Group items have structure: {sku, attributes, quantity, product} (from groupCartProductsByFilter)
    const sortedGroup = [...group].sort((a, b) => {
      const productA = a.product || a;
      const productB = b.product || b;
      const priceA = (productA && productA.price) || 0;
      const priceB = (productB && productB.price) || 0;
      return priceA - priceB;
    });

    const promoGroups = [];
    let remainingProducts = [...sortedGroup];
    let currentPromoGroup = {
      products: [],
      totalQuantity: 0
    };

    // Process products until we've allocated all quantities
    while (remainingProducts.length > 0) {
      const cartLine = remainingProducts[0];
      const availableQuantity = cartLine.quantity;
      const neededForThreshold = threshold - currentPromoGroup.totalQuantity;

      // Skip spent lines (e.g. remainder 0 after a split) so we never add quantity 0 to a group
      if (!availableQuantity || availableQuantity <= 0) {
        remainingProducts.shift();
        continue;
      }

      if (neededForThreshold <= 0) {
        // Current group is complete, start a new one
        promoGroups.push(currentPromoGroup);
        currentPromoGroup = {
          products: [],
          totalQuantity: 0
        };
        continue;
      }

      const useQty = Math.min(availableQuantity, neededForThreshold);

      // Push a snapshot of the cart line with the used quantity so each promo group
      // has its own copy and is not affected when we replace remainingProducts[0] or shift
      currentPromoGroup.products.push({
        cartLine: { ...cartLine, quantity: useQty, product: cartLine.product },
        quantity: useQty
      });
      currentPromoGroup.totalQuantity += useQty;

      const remainder = availableQuantity - useQty;

      if (remainder <= 0) {
        remainingProducts.shift();
      } else {
        remainingProducts[0] = { ...cartLine, quantity: remainder, product: cartLine.product };
      }

      if (currentPromoGroup.totalQuantity >= threshold) {
        promoGroups.push(currentPromoGroup);
        currentPromoGroup = { products: [], totalQuantity: 0 };
      }
    }

    // Add final group only if threshold is reached
    if (currentPromoGroup.totalQuantity >= threshold) {
      promoGroups.push(currentPromoGroup);
    }

    return promoGroups;
  };

  /**
   * Calculate weighted average price for selected products
   * @param {Array} selectedProducts - Array of {cartLine, quantity} objects
   * @returns {number} - Weighted average price
   */
  const calculateAveragePrice = (selectedProducts) => {
    if (!selectedProducts || selectedProducts.length === 0) {
      return 0;
    }

    let totalPrice = 0;
    let totalQuantity = 0;

    for (let i = 0; i < selectedProducts.length; i++) {
      const { cartLine, quantity } = selectedProducts[i];
      // cartLine might be the group item itself {sku, attributes, quantity, product}
      // or nested {cartLine: {...}, product: {...}}
      const product = cartLine.product || cartLine;
      const price = (product && product.price) || 0;

      totalPrice += price * quantity;
      totalQuantity += quantity;
    }

    if (totalQuantity === 0) {
      return 0;
    }

    // Round to 2 decimals so discount uses display precision (avoids 4.6→4.5999...→discount 4.59)
    const averagePrice = totalPrice / totalQuantity;
    return Math.round(averagePrice * 100) / 100;
  };

  /**
   * Calculate classic discount amount
   * @param {number} averagePrice - Average price of selected products
   * @param {number} quantity - Total quantity for discount
   * @param {number} percent - Discount percentage (e.g., 50 for 50%)
   * @returns {number} - Discount amount rounded to 2 decimals (round to avoid float showing 4.59 instead of 4.60)
   */
  const calculateClassicDiscount = (averagePrice, quantity, percent) => {
    if (!averagePrice || !quantity || !percent) {
      return 0;
    }

    // Calculate: (average price × quantity) × percent / 100
    const discount = (averagePrice * quantity) * (percent / 100);

    // Round to 2 decimals so group discount displays correctly (e.g. 4.60 not 4.59 from float)
    return Math.round(discount * 100) / 100;
  };

  /**
   * Calculate total price for selected products
   * @param {Array} selectedProducts - Array of {cartLine, quantity} objects
   * @returns {number} - Total price (sum of price * quantity), rounded to 2 decimals
   */
  const calculateTotalPriceForGroup = (selectedProducts) => {
    if (!selectedProducts || selectedProducts.length === 0) {
      return 0;
    }

    let totalPrice = 0;

    for (let i = 0; i < selectedProducts.length; i++) {
      const { cartLine, quantity } = selectedProducts[i];
      const product = cartLine.product || cartLine;
      const price = (product && product.price) || 0;

      totalPrice += price * quantity;
    }

    // Round to 2 decimals to keep consistency with other money calculations
    return Math.round(totalPrice * 100) / 100;
  };

  /**
   * Calculate all classic discounts for a cart
   * Processes all groups with promo classique and handles multiple promo groups
   * @param {Array} cart - Cart array with {sku, attributes, quantity}
   * @param {Object} products - Products object (w4.products)
   * @returns {Array} - Array of discount objects
   *   Format: [{ groupName, discount, savings, products, threshold, currentQuantity, promoGroups }, ...]
   */
  const calculateAllClassicDiscounts = (cart, products) => {
    // Handle both cart object { products: [...] } and products array [...]
    const cartProducts = Array.isArray(cart) ? cart : (cart?.products || []);

    if (!cartProducts || cartProducts.length === 0 || !products) {
      return [];
    }

    const discounts = [];
    const grouped = groupCartProductsByFilter(cartProducts, products);

    // Process each group
    for (const groupName in grouped) {
      const group = grouped[groupName];

      // Skip ungrouped products
      if (groupName === '_ungrouped') {
        continue;
      }

      // Check if group has promo classique
      const firstProduct = group[0]?.product;
      if (!firstProduct || !hasPromoClassique(firstProduct)) {
        continue;
      }

      const threshold = getGroupPromoThreshold(group);
      const totalQuantity = getGroupTotalQuantity(group);

      if (!threshold || totalQuantity < threshold) {
        // Threshold not reached, no discount
        continue;
      }

      // Determine promo calculation mode for this group:
      // - percent-based (existing behaviour using pourcent)
      // - fixed-price bundle using prix_fixe ("X POUR Y€ AU CHOIX")
      const hasPercent = !!firstProduct.pourcent;
      const hasFixedPrice = !!firstProduct.prix_fixe;

      // Prefer fixed-price if both are (incorrectly) set for the same product
      const promoMode = hasFixedPrice ? 'fixed' : (hasPercent ? 'percent' : null);
      if (!promoMode) {
        continue;
      }

      const percent = promoMode === 'percent'
        ? (parseFloat(firstProduct.pourcent) || 0)
        : 0;

      const fixedPrice = promoMode === 'fixed'
        ? (parseFloat(String(firstProduct.prix_fixe).replace(',', '.')) || 0)
        : 0;

      // If mode is percent, we need a non-zero percentage
      if (promoMode === 'percent' && percent === 0) {
        continue;
      }

      // Select products for discount (handles multiple promo groups if quantity exceeds threshold)
      const promoGroups = selectProductsForDiscount(group, threshold);

      // Calculate discount for each promo group
      const groupDiscounts = promoGroups.map((promoGroup, gIdx) => {
        let discount = 0;
        let averagePrice = 0;

        if (promoMode === 'percent') {
          // Existing percentage-based behaviour
          averagePrice = calculateAveragePrice(promoGroup.products);
          discount = calculateClassicDiscount(averagePrice, promoGroup.totalQuantity, percent);
        } else {
          // Fixed-price bundle: discount = sum(prices) - fixedPrice
          const totalPrice = calculateTotalPriceForGroup(promoGroup.products);
          averagePrice = promoGroup.totalQuantity ? totalPrice / promoGroup.totalQuantity : 0;

          const rawDiscount = totalPrice - fixedPrice;
          // Never allow negative discount
          discount = Math.max(0, Math.round(rawDiscount * 100) / 100);
        }

        return {
          promoGroup: promoGroup,
          discount: discount,
          averagePrice: averagePrice,
          quantity: promoGroup.totalQuantity
        };
      });

      // Sum all discounts for this group
      const totalDiscount = groupDiscounts.reduce((sum, d) => sum + d.discount, 0);

      discounts.push({
        groupName: groupName,
        discount: totalDiscount,
        savings: totalDiscount, // Same as discount for classic promo
        products: group,
        threshold: threshold,
        currentQuantity: totalQuantity,
        promoGroups: promoGroups,
        groupDiscounts: groupDiscounts // Individual promo group calculations
      });
    }

    return discounts;
  };

  /**
   * Get price by quantity for a product (helper function)
   * Handles pricesByQuantity if available
   * @param {Object} product - Product object
   * @param {number} quantity - Quantity
   * @returns {number} - Price for the quantity
   */
  const getPriceByQuantity = (product, quantity) => {
    if (!product) return 0;

    let price = product.price || 0;
    const pricesByQuantity = product.pricesByQuantity;

    if (pricesByQuantity && Array.isArray(pricesByQuantity)) {
      for (let i = 0; i < pricesByQuantity.length; i++) {
        const priceByQuantity = pricesByQuantity[i];
        if (quantity >= priceByQuantity.quantity) {
          price = priceByQuantity.price;
        }
      }
    }

    return price || 0;
  };

  /**
   * Calculate cart total with discounts applied
   * @param {Array} cart - Cart array with {sku, attributes, quantity}
   * @param {Object} products - Products object (w4.products)
   * @param {number} priceRatio - Price ratio multiplier (default: 1)
   * @returns {Object} - Total breakdown object
   *   Format: { baseTotal, classicDiscount, finalTotal, discounts }
   */
  const getCartTotalWithDiscounts = (cart, products, priceRatio = 1) => {
    // Handle both cart object { products: [...] } and products array [...]
    const cartProducts = Array.isArray(cart) ? cart : (cart?.products || []);

    if (!cartProducts || cartProducts.length === 0 || !products) {
      return {
        baseTotal: 0,
        classicDiscount: 0,
        cardBenefits: 0,
        finalTotal: 0,
        discounts: [],
        cardBenefitsDetails: []
      };
    }

    // Calculate base total (same logic as getTotalCartPrice)
    let baseTotal = 0;
    for (let i = 0; i < cartProducts.length; i++) {
      const cartLine = cartProducts[i];
      const product = products[cartLine.sku];
      if (!product) {
        continue;
      }

      const priceByQuantity = getPriceByQuantity(product, cartLine.quantity);
      baseTotal += cartLine.quantity * priceByQuantity * priceRatio;
    }
    // Round to 2 decimals so finalTotal isn't floored down by float (e.g. 9.1999... - 4.60 → 4.59)
    baseTotal = Math.round(baseTotal * 100) / 100;

    // Calculate classic discounts
    const discounts = calculateAllClassicDiscounts(cartProducts, products);
    const classicDiscount = discounts.reduce((sum, d) => sum + d.discount, 0);

    // Calculate card benefits (do NOT subtract from total)
    const cardBenefits = calculateAllCardDiscounts(cartProducts, products);
    const totalCardBenefits = cardBenefits.reduce((sum, b) => sum + b.cardBenefit, 0);

    // Final total = base minus classic discount. Round to 2 decimals to fix float (e.g. 9.2 - 4.6 → 4.5999... → show 4.60)
    // Card benefits do NOT subtract from total
    const rawFinal = baseTotal - classicDiscount;
    const finalTotal = Math.max(0, Math.round(rawFinal * 100) / 100);

    return {
      baseTotal: baseTotal,
      classicDiscount: classicDiscount,
      cardBenefits: totalCardBenefits,
      finalTotal: finalTotal,
      discounts: discounts,
      cardBenefitsDetails: cardBenefits // Array of card benefit objects
    };
  };

  /**
   * Calculate card discount for a single promo group
   * Similar to classic discount but uses pourcent_carte
   * @param {number} averagePrice - Average price of selected products
   * @param {number} quantity - Quantity in this promo group
   * @param {number} percent - Discount percentage (pourcent_carte)
   * @returns {number} - Card benefit amount (rounded down to 2 decimals)
   */
  const calculateCardDiscount = (averagePrice, quantity, percent) => {
    if (!averagePrice || !quantity || !percent) {
      return 0;
    }

    const totalPrice = averagePrice * quantity;
    const discountAmount = totalPrice * (percent / 100);

    // Round down to 2 decimals
    return Math.floor(discountAmount * 100) / 100;
  };

  /**
   * Calculate all card discounts for a cart
   * Processes all groups with promo carte and handles multiple promo groups
   * Card benefits do NOT subtract from cart total
   * @param {Array} cart - Cart array with {sku, attributes, quantity}
   * @param {Object} products - Products object (w4.products)
   * @returns {Array} - Array of card benefit objects
   *   Format: [{ groupName, cardBenefit, products, threshold, currentQuantity, promoGroups }, ...]
   */
  const calculateAllCardDiscounts = (cart, products) => {
    // Handle both cart object { products: [...] } and products array [...]
    const cartProducts = Array.isArray(cart) ? cart : (cart?.products || []);

    if (!cartProducts || cartProducts.length === 0 || !products) {
      return [];
    }

    const cardBenefits = [];
    const grouped = groupCartProductsByFilter(cartProducts, products);

    // Process each group
    for (const groupName in grouped) {
      const group = grouped[groupName];

      // Skip ungrouped products
      if (groupName === '_ungrouped') {
        continue;
      }

      // Check if group has promo carte (and NOT promo classique - mutual exclusivity)
      const firstProduct = group[0]?.product;
      if (!firstProduct || !hasPromoCarte(firstProduct)) {
        continue;
      }

      // Check mutual exclusivity - if both exist, skip card (classique takes precedence)
      if (hasPromoClassique(firstProduct)) {
        // Data issue: product has both promos, skip card promo
        console.warn(`Product group "${groupName}" has both promo classique and promo carte. Using promo classique only.`);
        continue;
      }

      const threshold = getGroupPromoThreshold(group);
      const totalQuantity = getGroupTotalQuantity(group);

      if (!threshold || totalQuantity < threshold) {
        // Threshold not reached, no card benefit
        continue;
      }

      // Determine promo calculation mode for card benefits:
      // - percent-based using pourcent_carte
      // - fixed-price bundle using prix_fixe_carte ("X POUR Y€ AU CHOIX" en carte)
      const hasPercentCarte = !!firstProduct.pourcent_carte;
      const hasFixedPriceCarte = !!firstProduct.prix_fixe_carte;

      const promoMode = hasFixedPriceCarte ? 'fixed' : (hasPercentCarte ? 'percent' : null);
      if (!promoMode) {
        continue;
      }

      const percent = promoMode === 'percent'
        ? (parseFloat(firstProduct.pourcent_carte) || 0)
        : 0;

      const fixedPriceCarte = promoMode === 'fixed'
        ? (parseFloat(String(firstProduct.prix_fixe_carte).replace(',', '.')) || 0)
        : 0;

      if (promoMode === 'percent' && percent === 0) {
        continue;
      }

      // Select products for discount (handles multiple promo groups if quantity exceeds threshold)
      const promoGroups = selectProductsForDiscount(group, threshold);

      // Calculate card benefit for each promo group
      const groupBenefits = promoGroups.map((promoGroup) => {
        let cardBenefit = 0;
        let averagePrice = 0;

        if (promoMode === 'percent') {
          // Existing percentage-based behaviour
          averagePrice = calculateAveragePrice(promoGroup.products);
          cardBenefit = calculateCardDiscount(averagePrice, promoGroup.totalQuantity, percent);
        } else {
          // Fixed-price card bundle: benefit = sum(prices) - fixed card price
          const totalPrice = calculateTotalPriceForGroup(promoGroup.products);
          averagePrice = promoGroup.totalQuantity ? totalPrice / promoGroup.totalQuantity : 0;

          const rawBenefit = totalPrice - fixedPriceCarte;
          // Never allow negative benefit
          cardBenefit = Math.max(0, Math.round(rawBenefit * 100) / 100);
        }

        return {
          promoGroup: promoGroup,
          cardBenefit: cardBenefit,
          averagePrice: averagePrice,
          quantity: promoGroup.totalQuantity
        };
      });

      // Sum all card benefits for this group
      const totalCardBenefit = groupBenefits.reduce((sum, b) => sum + b.cardBenefit, 0);

      cardBenefits.push({
        groupName: groupName,
        cardBenefit: totalCardBenefit,
        products: group,
        threshold: threshold,
        currentQuantity: totalQuantity,
        promoGroups: promoGroups,
        groupBenefits: groupBenefits // Individual promo group calculations
      });
    }

    return cardBenefits;
  };

  /**
   * Validate promo exclusivity for a product
   * Checks if product has both promo types and logs warning
   * @param {Object} product - Product object
   * @returns {string|null} - 'classique', 'carte', or null (returns the promo type to use)
   */
  const validatePromoExclusivity = (product) => {
    if (!product) {
      return null;
    }

    const hasClassique = hasPromoClassique(product);
    const hasCarte = hasPromoCarte(product);

    if (hasClassique && hasCarte) {
      // Both exist - data issue, log warning
      console.warn(`Product "${product.sku}" (${product.title}) has both promo classique and promo carte. Using promo classique only.`);
      return 'classique'; // Classique takes precedence
    }

    if (hasClassique) {
      return 'classique';
    }

    if (hasCarte) {
      return 'carte';
    }

    return null;
  };

  /**
   * Get promo status message for a group
   * @param {Array} group - Array of cart lines in the group
   * @param {number} threshold - Quantity threshold for promo
   * @param {number} discount - Calculated discount amount (if threshold reached)
   * @returns {Object} - Status message object
   *   Format: { type: 'not_reached' | 'reached', remaining: number, savings: number }
   */
  const getPromoStatusMessage = (group, threshold, discount = 0) => {
    if (!group || group.length === 0 || !threshold) {
      return {
        type: null,
        remaining: null,
        savings: 0
      };
    }

    const totalQuantity = getGroupTotalQuantity(group);

    if (totalQuantity < threshold) {
      // Threshold not reached
      const remaining = threshold - totalQuantity;
      return {
        type: 'not_reached',
        remaining: remaining,
        savings: 0
      };
    } else {
      // Threshold reached
      return {
        type: 'reached',
        remaining: 0,
        savings: discount
      };
    }
  };

  /**
   * Get card promo status message for a group
   * Similar to getPromoStatusMessage but for card benefits
   * @param {Array} group - Array of cart lines in the group
   * @param {number} threshold - Quantity threshold for card promo
   * @param {number} cardBenefit - Calculated card benefit amount (if threshold reached)
   * @returns {Object} - Status message object
   *   Format: { type: 'not_reached' | 'reached', remaining: number, benefits: number }
   */
  const getCardPromoStatusMessage = (group, threshold, cardBenefit = 0) => {
    if (!group || group.length === 0 || !threshold) {
      return {
        type: null,
        remaining: null,
        benefits: 0
      };
    }

    const totalQuantity = getGroupTotalQuantity(group);

    if (totalQuantity < threshold) {
      // Threshold not reached
      const remaining = threshold - totalQuantity;
      return {
        type: 'not_reached',
        remaining: remaining,
        benefits: 0
      };
    } else {
      // Threshold reached
      return {
        type: 'reached',
        remaining: 0,
        benefits: cardBenefit
      };
    }
  };

  /**
   * Split a group into completed promo groups and leftover items
   * Used when quantity exceeds threshold to show separate visual groups
   * @param {Array} group - Array of cart lines in the group (format: [{cartLine, product}, ...])
   * @param {number} threshold - Quantity threshold for promo
   * @returns {Object} - Split groups object
   *   Format: { completedGroups: [{cartLines: [...], quantity: number}], leftoverItems: [{cartLine, product, quantity}] }
   */
  const splitGroupByPromoGroups = (group, threshold) => {
    if (!group || group.length === 0 || !threshold) {
      return {
        completedGroups: [],
        leftoverItems: []
      };
    }

    // Get promo groups using selectProductsForDiscount
    const promoGroups = selectProductsForDiscount(group, threshold);

    // Track which cart lines and quantities have been allocated
    // Use a key based on sku + attributes to track allocations
    const allocatedQuantities = new Map(); // Map of "sku|attributes" -> allocated quantity

    // Build completed groups
    const completedGroups = promoGroups.map((promoGroup) => {
      // Reconstruct cart lines array from promo group products
      const cartLines = [];
      const cartLineMap = new Map(); // Track cart lines by sku+attributes

      promoGroup.products.forEach(({ cartLine, quantity }) => {
        // Create a unique key for this cart line
        // cartLine might be the group item itself (with sku, attributes, quantity, product)
        // or it might be nested {cartLine: {...}, product: {...}}
        const cartLineSku = cartLine.sku || (cartLine.cartLine && cartLine.cartLine.sku);
        const cartLineAttrs = cartLine.attributes || (cartLine.cartLine && cartLine.cartLine.attributes) || {};
        const key = `${cartLineSku}|${JSON.stringify(cartLineAttrs)}`;
        const currentAllocated = allocatedQuantities.get(key) || 0;
        allocatedQuantities.set(key, currentAllocated + quantity);

        // Find the original group item
        // Group items have structure: {sku, attributes, quantity, product} (from groupCartProductsByFilter)
        const originalItem = group.find(g => {
          const gSku = g.sku || (g.cartLine && g.cartLine.sku);
          const gAttrs = g.attributes || (g.cartLine && g.cartLine.attributes) || {};
          return gSku === cartLineSku &&
            JSON.stringify(gAttrs) === JSON.stringify(cartLineAttrs);
        });

        if (originalItem) {
          if (!cartLineMap.has(key)) {
            // Group item structure: {sku, attributes, quantity, product}
            cartLineMap.set(key, {
              cartLine: {
                sku: originalItem.sku,
                attributes: originalItem.attributes || {},
                quantity: 0
              },
              product: originalItem.product,
              quantity: 0
            });
          }
          cartLineMap.get(key).cartLine.quantity += quantity;
          cartLineMap.get(key).quantity += quantity;
        }
      });

      // Convert map to array
      cartLines.push(...Array.from(cartLineMap.values()));

      return {
        cartLines: cartLines,
        quantity: promoGroup.totalQuantity,
        threshold: threshold
      };
    });

    // Find leftover items (items not fully allocated)
    // Group items have structure: {sku, attributes, quantity, product} (from groupCartProductsByFilter)
    const leftoverItems = [];
    group.forEach((groupItem) => {
      // Handle both structures: {sku, attributes, quantity, product} or {cartLine: {...}, product: {...}}
      const itemSku = groupItem.sku || (groupItem.cartLine && groupItem.cartLine.sku);
      const itemAttrs = groupItem.attributes || (groupItem.cartLine && groupItem.cartLine.attributes) || {};
      const itemQuantity = groupItem.quantity || (groupItem.cartLine && groupItem.cartLine.quantity) || 0;
      const key = `${itemSku}|${JSON.stringify(itemAttrs)}`;
      const allocated = allocatedQuantities.get(key) || 0;
      const remaining = itemQuantity - allocated;

      if (remaining > 0) {
        leftoverItems.push({
          cartLine: {
            sku: itemSku,
            attributes: itemAttrs,
            quantity: remaining
          },
          product: groupItem.product,
          quantity: remaining
        });
      }
    });

    return {
      completedGroups: completedGroups,
      leftoverItems: leftoverItems
    };
  };

  (() => {

    // w.Main.xmlManager.getVariable('locale') returns a string in format "fr_FR.UTF-8"
    const getReaderLocale = () => w.Main.xmlManager.getVariable('locale').split('.')[0];

    const getTranslationPath = (locale = DEFAULT_LOCALE, isOverride = false) =>
      `./publication/contents/templates/wishlistV4/translations/${locale}${isOverride ? '-override' : ''}.json`;

    const getTranslations = async () => {
      const readerLocale = getReaderLocale();

      let translations;
      try {
        translations = await promiseXHRJSON(getTranslationPath(readerLocale));
      } catch {
        translations = await promiseXHRJSON(getTranslationPath(DEFAULT_LOCALE));
      }

      try {
        const overrides = await promiseXHRJSON(getTranslationPath(readerLocale, true));
        for (let [componentKey, componentOverrides] of Object.entries(overrides)) {
          for (let [translationKey, overrideValue] of Object.entries(componentOverrides)) {
            translations[componentKey][translationKey] = overrideValue;
          }
        }
      } catch {
        // no override file, nothing to do

      return translations;

      let msg = msgTemplate;

          msg = msg.replaceAll('${' + variableName + '}', variables[variableName]);
        }
      }

      return msg;
    }

    window.wishlistV4.i18n = {
      getTranslations,
      translate,
    };

  var formatProducts = function (products, formatActions) {

  const formatProductByAction = (product, formatAction) => {

  const formatPricesByQuantity = (product, formatAction) => {

    keyAsNumbers.forEach(key => {

  const formatLowercase = function (product, formatAction) {

      return null;
    };

    var getDistributorIdFromUrl = function () {
      return getSearchParamFromUrl('transferring');
    };

    var getKeyFromUrl = function () {
      return getSearchParamFromUrl('key');
    };

    var getSearchParamFromUrl = function (param) {
      var urlString = window.location.search;
      var searchParams = new URLSearchParams(urlString);

      return searchParams.get(param);
    };

    var getProductsJson = function () {
      var distributorId = getDistributorIdFromUrl();
      var key = getKeyFromUrl();
      if (distributorId && key) {
        return getDistributorProductsJson(distributorId, key)
          .catch(function () {
            return getPublicProductsJson();
          });
      }

      return getPublicProductsJson();
    };

    const getPublicProductsJson = () => promiseXHRJSON('./publication/contents/templates/wishlistV4/products.json');

    const getDistributorProductsJson = (distributorId, key) => promiseXHRJSON(`./publication/contents/templates/wishlistV4/products-${distributorId}-${key}.json`);

    Promise.all([getConfigJson(), getProductsJson(), window.wishlistV4.i18n.getTranslations()])
      .then(([config, products, translations]) => {
        config.contactForm.defaultDistributorId = getDefaultDistributorId();
        config.playlistParam = getPlaylistParamFromUrl();
        window.wishlistV4.config = config;
        window.wishlistV4.translations = translations;

        window.wishlistV4.config.products.images.folderUrl = w.Utils.resolveVariable(window.wishlistV4.config.products.images.folderUrl);
        if (window.wishlistV4.config.products.images.onlineFolderUrl) {
          window.wishlistV4.config.products.images.onlineFolderUrl = w.Utils.resolveVariable(window.wishlistV4.config.products.images.onlineFolderUrl);
        }
        return formatProducts(products, window.wishlistV4.config.products.formatActions);
      })
      .then((products) => {
        products = modifyProductsForPlaylistIfNeeded(products);
        window.wishlistV4.config.projectLogo = getMediaUrl(window.wishlistV4.config.projectLogo);

        window.wishlistV4.products = {};
        for (let i = 0; i < products.length; i++) {
          const product = products[i];
          product.brandLogo = getMediaUrl(product.brandLogo);
          product.medias = getMedias(product.images);
          product.descriptionLogos = getMediaUrls(product.descriptionLogos);
          formatProductPages(product);
          window.wishlistV4.products[product.sku] = product;
        }
      })
      .then(() => {
        const disableAutoRelatedProducts = window.wishlistV4.config.products.disableAutoRelatedProducts || (
          window.wishlistV4.config.products.related &&
          window.wishlistV4.config.products.related.automatic &&
          window.wishlistV4.config.products.related.automatic.enabled === false
        );

        if (disableAutoRelatedProducts) {
          return;
        }

        const isBidirectionalRelationDisabled = window.wishlistV4.config.products.related &&
          window.wishlistV4.config.products.related.automatic &&
          window.wishlistV4.config.products.related.automatic.bidirectional === false;

        const relationProperties = window.wishlistV4.config.products.related?.automatic?.properties || [];

        const productIds = Object.keys(window.wishlistV4.products);
        productIds
          .forEach(productId => autoAddToRelatedProducts(
            productIds,
            isBidirectionalRelationDisabled,
            relationProperties,
            productId
          ));
      })
      .then(function () {
        var shouldInitCarts = !isCartsInitialized();
        if (shouldInitCarts) {
          var previousCart = initCarts();
          if (!window.wishlistV4.config.enableMultipleCarts) {
            createCart('default', previousCart)
          }
        }
      })
      .catch(function (error) {
        console.error('Missing/invalid config.json, products.json or translations.json. error:', error);
      })
      .then(handleHashParams)
      .then(() => {
        NIApi.event.registerPluginEvent('wishlistOpenProduct', (params) => wishlistV4.API.openProductPopup(params.sku, params.attributes));
        NIApi.event.registerPluginEvent('wishlistAddProductToCart', (params) => wishlistV4.API.addProductInCart(params.sku, params.attributes, params.quantity || 1));
        NIApi.event.registerPluginEvent('wishlistOpenProductExternalUrl', (params) => wishlistV4.API.openProductExternalUrl(params.sku));
      }).then(() => {
        wishlistV4.isLoaded = true;
        w.Main.eventEmul.callEvent('wishlistLoaded');
      });
  };

  const modifyProductsForPlaylistIfNeeded = function (products) {
    const playlistManager = window.w.Main.playlistManager;
    if (!playlistManager || playlistManager.isEnabled !== true) {
      return products;
    }

    const pageIndexes = playlistManager.getPageIndexes();
    const filteredProducts = products.filter(product => filterProductsForPlaylist(product, pageIndexes));
    const modifiedProducts = filteredProducts.map(product => mapProductPagesToPlaylistPages(product, playlistManager));

    return modifiedProducts;
  };

  const filterProductsForPlaylist = function (product, pageIndexes) {
    if (!product.pages || product.pages.length === 0) {
      return true;
    }

    return product.pages.some(page => pageIndexes.includes(page - 1));
  }

  const mapProductPagesToPlaylistPages = function (product, playlistManager) {
    if (product.pages) {
      product.pages = product.pages.map(page => playlistManager.getPlaylistedPageNumber(page));
    }
    return product;
  }

  const autoAddToRelatedProducts = function (productIds, isBidirectionalRelationDisabled, relationProperties, productId) {
    const product = window.wishlistV4.products[productId];
    if (!isBidirectionalRelationDisabled) {
      if (Array.isArray(product.relatedProducts)) {
        product.relatedProducts.forEach(relatedProductId => addToRelatedProducts(relatedProductId, productId));
      }
    }

    productIds.forEach(comparedProductId => addRelatedProductsByProperties(productId, relationProperties, comparedProductId));
  };

  const addRelatedProductsByProperties = (productId, relationProperties, comparedProductId) => {
    const isRelatedByProperty = relationProperties.some(property => areProductsRelatedByProperties(productId, comparedProductId, property));
    if (isRelatedByProperty) {
      addToRelatedProducts(productId, comparedProductId);
    }
  };

  const areProductsRelatedByProperties = (productId, comparedProductId, property) => {
    if (productId === comparedProductId) {
      return false;
    }

    const product = window.wishlistV4.products[productId];
    const productValue = product[property];
    const comparedProduct = window.wishlistV4.products[comparedProductId];
    const comparedProductValue = comparedProduct[property];
    if (!productValue || !comparedProductValue) {
      return false;
    }

    if (Array.isArray(productValue)) {
      return productValue.some(value => comparedProductValue.includes(value));
    }

    return productValue === comparedProductValue;
  }

  const addToRelatedProducts = (productId, newRelatedProductId) => {
    if (window.wishlistV4.products[productId]) {
      const relatedProductIds = window.wishlistV4.products[productId].relatedProducts || [];
      if (!relatedProductIds.includes(newRelatedProductId)) {
        relatedProductIds.push(newRelatedProductId);
      }

      window.wishlistV4.products[productId].relatedProducts = relatedProductIds;
    }
  };

  const handleHashParams = () => {
    const hashParams = getHashValues(['wlSku', 'wlAttributes', 'wlSource', 'wlSelection']);

    const shouldOpenProductPopup = hashParams.wlSku && !window.wishlistV4.config.general.hideProductPages;

    const attributes = parseHashAttributes(hashParams.wlAttributes);
    const source = hashParams.wlSource || 'publication';

    if (shouldOpenProductPopup) {
      window.wishlistV4.API.openProductPopup(hashParams.wlSku, attributes, source);
    }

    handleHashSelectionParam(hashParams.wlSelection, !shouldOpenProductPopup);
  };

  const getHashValues = keys =>
    keys.reduce((acc, key) => {
      acc[key] = getHashValue(key);
      return acc;
    }, {});

  const getHashValue = key => {
    const matches = location.hash.match(new RegExp(key + '=([^&]*)'));
    return matches && matches.length === 2 ? decodeURIComponent(matches[1]) : null;
  };

  const parseHashAttributes = attributesString => {
    if (!attributesString) {
      return {};
    }

    try {
      return JSON.parse(attributesString);
    } catch (error) {
      console.error('Error parsing hash param wlAttributes:', error);
      return {};
    }
  };

  const handleHashSelectionParam = (selectionParam, mustOpenCartPanel) => {
    if (selectionParam) {
      const cartProducts = getCartFromSelectionParam(selectionParam);
      if (cartProducts) {
        setCurrentCartProducts(cartProducts);
        location.hash = location.hash.replace(/&?wlSelection=[^&]*/, '');
        if (mustOpenCartPanel) {
          window.wishlistV4.API.openCartPanel();
        }
      }
    }
  };

  const getProductField = (product, field, isSlider = false) => {
    if (!product || !field) {
      return null;
    }

    switch (field.key) {
      case 'firstImage':
        const firstImageIndex = getFirstImageIndex(product.medias);
        if (firstImageIndex === -1) {
          return null;
        }
        return product.medias[firstImageIndex].url;
      case 'medias':
        return !isSlider ? product.medias[field.position - 1].url : product.medias.map(item => item.url);
      case 'wpCustom':
        field.key = field.customFieldName;
      // fall through default case after replacing the key
      default:
        const value = product[field.key];
        if (Array.isArray(value)) {
          return !isSlider ? value[(field.position - 1) || 0] : value;
        }
        // if field is in an object with a property "url" (usually the case for media fields)
        if (value && typeof value === 'object' && value.url) {
          return value.url;
        }
        return value;
    }
  }

  /* fetch() replacement because in android app, fetch() can't get local files */
  var promiseXHRJSON = function (fileUrl) {
    return new Promise(function (resolve, reject) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', fileUrl);
      xhr.onload = function () {
        try {
          resolve(JSON.parse(xhr.response));
        } catch (error) {
          reject({
            status: xhr.status,
            message: error
          });
        }
      }
      xhr.onerror = () => reject({
        status: xhr.status,
        message: xhr.statusText
      });
      xhr.send();
    });
  };

  window.addEventListener('webpub-init', () => {
    init();
  });
